# Beaver CI — runs the unit suite on Linux AND Windows, plus a small lint gate.
#
# Why both OSes: the project is developed on Windows but most test runs happen
# on Linux. Bugs that only exist on one of them (e.g. text-encoding defaults,
# path separators) are invisible to the other, so every push exercises both.
#
# Nothing here needs Ollama, a GPU, or network access to a model: the unit
# tests use fakes. The frontend job type-checks and builds web/frontend (that
# is all it does -- there are no frontend tests), so a TypeScript error can no
# longer slip onto main unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new ruff release can't turn main red by itself.
      # Rules live in ruff.toml (undefined names, syntax/IO errors, unused
      # imports/variables, redefinitions).
      - run: python -m pip install ruff==0.17.0
      - run: ruff check .

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false          # a Windows failure must not hide a Linux result (or vice versa)
      matrix:
        # ubuntu-24.04 rather than ubuntu-latest: the latest label migrates to
        # Ubuntu 26 on 2026-10-19 and a runner image change shouldn't be able
        # to turn main red by itself. Bump deliberately.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12"]   # README: "Python 3.11+"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/unit -v

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      # package.json's "build" is `tsc -b && vite build`: type errors fail it.
      - run: npm run build
