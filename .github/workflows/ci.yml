# Beaver CI — runs the unit suite on Linux AND Windows, plus a small lint gate.
#
# Why both OSes: the project is developed on Windows but most test runs happen
# on Linux. Bugs that only exist on one of them (e.g. text-encoding defaults,
# path separators) are invisible to the other, so every push exercises both.
#
# Nothing here needs Ollama, a GPU, Node, or network access to a model: the
# unit tests use fakes. (Frontend build/tests are not part of this workflow.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new ruff release can't turn main red by itself.
      # Rules live in ruff.toml (undefined names + syntax/IO errors only).
      - run: python -m pip install ruff==0.17.0
      - run: ruff check .

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false          # a Windows failure must not hide a Linux result (or vice versa)
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]   # README: "Python 3.11+"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/unit -v
